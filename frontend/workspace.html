<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grant Portal — Workspace</title>
<style>
  :root {
    --bg: #07110f;
    --panel: #0f1a17;
    --line: #21352d;
    --text: #e5f0eb;
    --muted: #7e958a;
    --accent: #39d98a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "IBM Plex Mono", "JetBrains Mono", monospace;
    background: radial-gradient(circle at top, #12221d 0%, var(--bg) 60%);
    color: var(--text);
    padding: 30px 16px 60px;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    padding: 12px 16px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: rgba(15, 26, 23, 0.95);
    margin-bottom: 18px;
    font-size: 12px;
    color: var(--muted);
  }
  .topbar b { color: var(--accent); }
  .topbar a {
    color: var(--muted);
    text-decoration: none;
    cursor: pointer;
    border-bottom: 1px dashed var(--muted);
  }
  .topbar a:hover { color: var(--text); border-color: var(--text); }
  .workspace-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 24px;
  }
  h1 { margin: 0 0 8px; font-size: 20px; }
  .hint { color: var(--muted); margin: 0 0 18px; line-height: 1.6; }
  .workflow-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }
  .workflow-card {
    border: 1px solid var(--line);
    background: #0a140f;
    color: var(--text);
    border-radius: 10px;
    padding: 16px;
    text-align: left;
    cursor: pointer;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .workflow-card:hover {
    transform: translateY(-1px);
    border-color: var(--accent);
  }
  .workflow-card h3 { margin: 0 0 6px; color: var(--accent); font-size: 14px; }
  .workflow-card p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
  @media (max-width: 640px) {
    .workflow-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>Session <b id="hdr-session">—</b> on <b id="hdr-host">—</b></div>
    <div class="topbar-actions">
      <a id="disconnect-link" class="danger">disconnect</a>
    </div>
  </div>

  <section class="workspace-card">
    <h1>Connected workspace</h1>
    <p class="hint">Your portal session is active. Choose the rights workflow you want to open.</p>
    <div class="workflow-grid">
      <button class="workflow-card" data-target="informix/informix.html">
        <h3>Informix Rights</h3>
        <p>Open the Informix workflow from this connected workspace.</p>
      </button>
      <button class="workflow-card" data-target="mysql/mysql.html">
        <h3>MySQL Rights</h3>
        <p>Open the MySQL workflow from this connected workspace.</p>
      </button>
      <button class="workflow-card" data-target="greenplum/greenplum.html">
        <h3>Greenplum Rights</h3>
        <p>Open the Greenplum workflow from this connected workspace.</p>
      </button>
      <button class="workflow-card" data-target="postgres/postgres.html">
        <h3>Postgres Rights</h3>
        <p>Open the Postgres workflow from this connected workspace.</p>
      </button>
    </div>
  </section>
</div>

<script>
function $(id){ return document.getElementById(id); }

const API_BASE = sessionStorage.getItem("gp_api_base") || `${window.location.protocol}//${window.location.hostname}:8000/api`;
const token = sessionStorage.getItem("gp_token");
const sessionId = sessionStorage.getItem("gp_session_id");

if (!token || !sessionId) {
  window.location.href = "index.html";
}

document.title = "Grant Portal — Workspace";
$("hdr-session").textContent = sessionId ? sessionId.slice(0, 8) + "…" : "—";
$("hdr-host").textContent = sessionStorage.getItem("gp_current_host") || "—";

document.querySelectorAll('[data-target]').forEach(button => {
  button.addEventListener('click', () => {
    const nextPage = button.getAttribute('data-target');
    sessionStorage.setItem('gp_target_page', nextPage);
    sessionStorage.setItem('gp_last_target_page', nextPage);
    sessionStorage.setItem('gp_db_type', nextPage.split('/')[0]);
    window.location.href = nextPage;
  });
});

$("disconnect-link").addEventListener("click", async () => {
  await fetch(`${API_BASE}/disconnect/`, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": `Token ${token}` },
    body: JSON.stringify({ session_id: sessionId })
  }).catch(() => {});
  sessionStorage.clear();
  window.location.href = "index.html";
});
</script>
</body>
</html>
